services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: whatsapp_gateway
      POSTGRES_USER: whatsapp_gateway
      POSTGRES_PASSWORD: whatsapp_gateway_change_me

    volumes:
      - whatsapp_gateway_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_gateway -d whatsapp_gateway"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - whatsapp_gateway_net

  whatsapp-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://whatsapp_gateway:whatsapp_gateway_change_me@postgres:5432/whatsapp_gateway?schema=public
      NODE_ENV: production

    ports:
      - "3105:3105"

    volumes:
      - whatsapp_gateway_storage:/app/storage

    networks:
      - whatsapp_gateway_net

volumes:
  whatsapp_gateway_postgres_data:
    name: whatsapp_gateway_postgres_data

  whatsapp_gateway_storage:
    name: whatsapp_gateway_storage

networks:
  whatsapp_gateway_net:
    name: whatsapp_gateway_net
    driver: bridge
